[project]
name = "kite-forecast"
version = "0.1.0"
description = "Kitesurf conditions analysis for Gran Canaria"
readme = "../README.md"
authors = [
    { name = "Sergio Betancor", email = "serbetancor@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[project.scripts]
kite-forecast = "kite_forecast:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
