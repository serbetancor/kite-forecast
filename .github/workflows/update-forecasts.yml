name: Update forecast cache

on:
  schedule:
    - cron: "0 2 * * *"
      timezone: "Atlantic/Canary"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-forecast-cache
  cancel-in-progress: false

jobs:
  update-forecasts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --no-dev

      - name: Configure Git and prepare daily branch
        id: prepare
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          RUN_DATE="$(TZ=Atlantic/Canary date +%F)"
          BRANCH_NAME="bot/forecasts-${RUN_DATE}"

          git checkout -B "$BRANCH_NAME" origin/main

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Update beaches sequentially
        working-directory: backend
        env:
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail

          BEACH_IDS="$(uv run --no-sync python -c \
            'from kite_forecast.config.beaches import BEACHES; print("\n".join(beach.id for beach in BEACHES))')"

          TOTAL="$(printf '%s\n' "$BEACH_IDS" | grep -c .)"
          INDEX=0

          while IFS= read -r BEACH_ID; do
            [ -n "$BEACH_ID" ] || continue

            INDEX=$((INDEX + 1))

            echo "[$INDEX/$TOTAL] Updating forecast for $BEACH_ID..."

            uv run --no-sync python scripts/update_forecasts.py \
              --beach-id "$BEACH_ID"

            OUTPUT_FILE="data/forecasts/${BEACH_ID}.json"

            if [ ! -s "$OUTPUT_FILE" ]; then
              echo "::error::Missing or empty forecast file: $OUTPUT_FILE"
              exit 1
            fi

            git add "$OUTPUT_FILE"

            if ! git diff --cached --quiet; then
              git commit -m "chore: update forecast for ${BEACH_ID}"
              git push --force origin "$BRANCH_NAME"
            else
              echo "No changes for $BEACH_ID."
            fi

            if [ "$INDEX" -lt "$TOTAL" ]; then
              echo "Waiting 3 minutes before the next beach..."
              sleep 180
            fi
          done <<< "$BEACH_IDS"

      - name: Validate complete forecast cache
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          uv run --no-sync python - <<'PY'
          from pathlib import Path

          from kite_forecast.config.beaches import BEACHES
          from kite_forecast.models.cached_forecast import CachedForecast

          directory = Path("data/forecasts")

          expected_files = {f"{beach.id}.json" for beach in BEACHES}
          actual_files = {path.name for path in directory.glob("*.json")}

          if actual_files != expected_files:
              raise SystemExit(
                  f"Forecast files mismatch. Expected: {expected_files}; "
                  f"found: {actual_files}"
              )

          for beach in BEACHES:
              path = directory / f"{beach.id}.json"
              forecast = CachedForecast.model_validate_json(
                  path.read_text(encoding="utf-8")
              )

              if (
                  forecast.weather.beach.id != beach.id
                  or forecast.marine.beach.id != beach.id
              ):
                  raise SystemExit(
                      f"Forecast data does not match beach {beach.id}"
                  )

              print(f"Validated: {path.name}")

          print("All forecast files are present and valid.")
          PY

      - name: Generate score cache
        working-directory: backend
        run: uv run --no-sync python scripts/update_scores.py

      - name: Validate score cache
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          uv run --no-sync python - <<'PY'
          from pathlib import Path

          from kite_forecast.config.beaches import BEACHES
          from kite_forecast.models.scored_forecast import ScoreCache

          path = Path("data/scores.json")

          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("Score cache is missing or empty.")

          cache = ScoreCache.model_validate_json(
              path.read_text(encoding="utf-8")
          )

          expected_ids = {beach.id for beach in BEACHES}
          actual_ids = {entry.beach_id for entry in cache.entries}

          if not cache.entries:
              raise SystemExit("Score cache contains no entries.")

          if actual_ids != expected_ids:
              raise SystemExit(
                  f"Score cache beach mismatch. "
                  f"Expected: {sorted(expected_ids)}; "
                  f"found: {sorted(actual_ids)}"
              )

          print(f"Validated: {path}")
          print(f"Beaches: {len(actual_ids)}")
          print(f"Scored hours: {len(cache.entries)}")
          print("Score cache is valid.")
          PY

      - name: Commit score cache
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/scores.json

          if git diff --cached --quiet; then
            echo "Score cache has no changes."
            exit 0
          fi

          git commit -m "chore: update forecast scores cache"
          git push origin "$BRANCH_NAME"

      - name: Check for changes
        id: changes
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        run: |
          set -euo pipefail

          git fetch origin main

          if git diff --quiet "origin/main...${BRANCH_NAME}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No forecast changes to publish."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ steps.prepare.outputs.branch_name }}
        shell: bash
        run: |
          set -euo pipefail

          PR_NUMBER="$(gh pr list \
            --base main \
            --head "$BRANCH_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            PR_BODY="$(printf '%s\n' \
              'All beach forecasts were fetched and validated successfully.' \
              '' \
              'The hourly score cache was generated and validated successfully.' \
              '' \
              'Forecast-Cache-Bot: true')"

            gh pr create \
              --base main \
              --head "$BRANCH_NAME" \
              --title "chore: update forecast cache" \
              --body "$PR_BODY"

            PR_NUMBER="$(gh pr view "$BRANCH_NAME" \
              --json number --jq '.number')"
          fi

          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Created or updated PR #$PR_NUMBER."

      - name: Squash and merge pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject "chore: update forecast cache (#${PR_NUMBER})" \
            --body "$(printf '%s\n\n%s' \
              'Forecast-Cache-Bot: true' \
              "Pull request: https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER}")"
